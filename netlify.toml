[build]
  command = "npm install && npm run generate"
  publish = "dist"

# Early-access signup proxies to Plunk through here, so the API key stays off
# the client. The function declares its own route (/api/early-access) via
# `config.path`, so it needs no redirect rule.
[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Cache hashed assets aggressively
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deep linking — iOS Universal Links association file must be served as JSON
# (no extension) with no redirect. See docs in the alexandria app repo.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Deep-link app paths (/guardian/*, /course/*, /classroom/*, /open) are NOT
# declared here. Nitro's netlify-static preset writes its own dist/_redirects
# ending in `/* /404.html 404`, and Netlify evaluates _redirects before
# netlify.toml — so rules kept here lost to that catch-all and every one of
# those paths returned a 404. They live in public/_redirects instead, where the
# preset appends its catch-all after them. See the comments in that file.
