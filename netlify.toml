[build]
  command = "npm install && npm run generate"
  publish = "dist"

# Early-access signup proxies to Plunk through here, so the API key stays off
# the client. The function declares its own route (/api/early-access) via
# `config.path`, so it needs no redirect rule.
[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Asset caching is deliberately NOT set here. Nitro writes dist/_headers with
# three rules that this one blanket rule was overriding:
#
#   /_nuxt/builds/meta/*  1 year, immutable   (path carries the build id)
#   /_nuxt/builds/*       max-age=1           (latest.json is a FIXED path)
#   /_nuxt/*              1 year, immutable   (filenames carry a content hash)
#
# The middle rule is the one that matters. `_nuxt/builds/latest.json` is how the
# app detects that a new version has been deployed, and its URL never changes —
# so caching it for a year strands a client on whatever build it first saw.
# Setting Cache-Control for /_nuxt/* here matched that file too and emitted a
# second, conflicting header (Netlify warned about it on every build: "the same
# header is set twice with different cases").

# Security headers
#
# The site carries deep links into the desktop and mobile app (/guardian/*,
# /course/*, /classroom/*, /open), so a script-injection here has a path toward
# app users rather than stopping at a marketing page.
#
# The CSP is written against what this site actually serves, which was checked
# against a real `npm run generate` output rather than assumed:
#
#   script-src 'unsafe-inline'  — Nuxt emits several inline scripts per page
#     (the import map, the no-flash theme bootstrap, `window.__NUXT__`) and a
#     static `generate` build has no nonce to hand them. Removing this needs
#     build-side CSP hash support, not a header edit, and shipping a policy
#     that blanks the site is worse than shipping an honest one. Recorded as
#     still open in ../docs/security-audit.md.
#   script-src https://plausible.io — the analytics bundle.
#   connect-src https://plausible.io — where it sends events.
#
# The directives that DO bite without that work are still worth having:
# `connect-src` bounds where injected script could exfiltrate to,
# `frame-ancestors 'none'` stops clickjacking (and is the half browsers honour
# over X-Frame-Options), `object-src 'none'` and `base-uri 'none'` close two
# classic injection vectors, and `form-action 'self'` stops a form being
# repointed at another origin.
#
# HSTS is preload-eligible: Netlify serves this over TLS and there is no
# plaintext origin to strand.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://plausible.io; media-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deep linking — iOS Universal Links association file must be served as JSON
# (no extension) with no redirect. See docs in the alexandria app repo.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Deep-link app paths (/guardian/*, /course/*, /classroom/*, /open) are NOT
# declared here. Nitro's netlify-static preset writes its own dist/_redirects
# ending in `/* /404.html 404`, and Netlify evaluates _redirects before
# netlify.toml — so rules kept here lost to that catch-all and every one of
# those paths returned a 404. They live in public/_redirects instead, where the
# preset appends its catch-all after them. See the comments in that file.
